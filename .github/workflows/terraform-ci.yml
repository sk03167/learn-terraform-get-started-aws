name: "Terraform Data Platform Multi-Env CI/CD"

on:
  push:
    branches:
      - dev
      - staging
      - main
  pull_request:
    branches:
      - dev
      - staging
      - main

jobs:
  terraform:
    name: "Data Infrastructure Deployment Pipeline"
    runs-on: ubuntu-latest
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.0

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -no-color

      # 🧠 LEAD STEP: Map the active Git branch to the corresponding Terraform Workspace
      - name: Select Active Workspace
        run: |
          if [ "${{ github.base_ref }}" = "main" ] || [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "TARGET_ENV=prod" >> $GITHUB_ENV
          elif [ "${{ github.base_ref }}" = "staging" ] || [ "${{ github.ref }}" = "refs/heads/staging" ]; then
            echo "TARGET_ENV=staging" >> $GITHUB_ENV
          else
            echo "TARGET_ENV=dev" >> $GITHUB_ENV
          fi

      # Switch or create the dynamic workspace securely inside the runner
      - name: Switch Workspace
        run: |
          terraform workspace select ${{ env.TARGET_ENV }} || terraform workspace new ${{ env.TARGET_ENV }}

      # 🔍 Automated Quality Control: Run Plan previews on all Pull Requests
      - name: Terraform Plan Preview
        if: github.event_name == 'pull_request'
        run: terraform plan -no-color

      # ⚡ Production-Grade Isolation: Apply changes ONLY during direct pushes/merges to target tracks
      - name: Terraform Automated Apply
        if: github.event_name == 'push'
        run: terraform apply -auto-approve -no-color
